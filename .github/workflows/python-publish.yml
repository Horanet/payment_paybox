# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  push:
    branches:
      - "13.0"

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grant write permission to the GITHUB_TOKEN for this job

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Build release distributions
        id: build
        run: |
          python -m pip install build
          python -m build

      - name: 🔎 Extract Version Number
        id: versioning
        run: |
          FILE_PATH=$(find "./dist" -type f -name "odoo*_payment_paybox-*.tar.gz")
          FILENAME=$(basename "$FILE_PATH")
          VERSION=${FILENAME#*-}
          VERSION=${VERSION%.tar.gz}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Create/Update tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${{ steps.versioning.outputs.version }}`,
              sha: context.sha
            }).catch(err => {
              if (err.status !== 422) throw err;
              github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ steps.versioning.outputs.version }}',
                sha: context.sha
              });
            })

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          name: Release ${{ steps.versioning.outputs.version }}
          files: dist/**
